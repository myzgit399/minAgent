model:
  provider: custom:modelscope
  default: custom:modelscope:Qwen/Qwen3.5-35B-A3B

providers:
  modelscope:
    api: https://api-inference.modelscope.cn/v1
    key_env: MODELSCOPE_KEY
    transport: chat_completions
    default_model: Qwen/Qwen3.5-35B-A3B

  deepseek:
    api: https://api.deepseek.com/v1
    key_env: DEEPSEEK_API_KEY
    transport: chat_completions
    default_model: deepseek-flash

  # Aliyun (阿里云百炼 / DashScope) — mainland China compatible-mode endpoint.
  # The key lives in ALI_KEY; the `aliyun` provider profile
  # (plugins/model-providers/aliyun) supplies the same base URL and catalog.
  aliyun:
    api: https://dashscope.aliyuncs.com/compatible-mode/v1
    key_env: ALI_KEY
    transport: chat_completions
    default_model: qwen3.6-plus

updates:
  check: true
